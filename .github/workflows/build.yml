name: Android verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon --max-workers=2 :app:assembleDebug :app:testDebugUnitTest :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: '**/build/reports/'

  binder-arm-device:
    # Configure this repository variable only for an existing trusted runner
    # with an attached ARM device; there is no x86 Paddle-Lite payload.
    if: ${{ vars.ANDROID_ARM64_RUNNER != '' }}
    runs-on: ${{ vars.ANDROID_ARM64_RUNNER }}
    timeout-minutes: 90
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon --max-workers=2 :app:connectedDebugAndroidTest
